<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Jellyfin Randomizer</title>
</head>
<body>
<div id="randomizerConfigurationPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <form id="randomizerConfigurationForm">
                <h2 class="sectionTitle">Jellyfin Randomizer</h2>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input id="Enabled" type="checkbox" is="emby-checkbox">
                        <span>Enable Randomizer</span>
                    </label>
                </div>

                <div class="selectContainer">
                    <label class="selectLabel" for="DefaultEpisodeStrategy">Default episode strategy</label>
                    <select id="DefaultEpisodeStrategy" is="emby-select">
                        <option value="EqualEpisode">Equal episode</option>
                        <option value="EqualShow">Equal show</option>
                    </select>
                </div>

                <div class="selectContainer">
                    <label class="selectLabel" for="DefaultWatchedFilter">Default watched filter</label>
                    <select id="DefaultWatchedFilter" is="emby-select">
                        <option value="All">All</option>
                        <option value="Unwatched">Unwatched</option>
                        <option value="Watched">Watched</option>
                    </select>
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input id="AnimationEnabled" type="checkbox" is="emby-checkbox">
                        <span>Roulette presentation</span>
                    </label>
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input id="AnimationAudio" type="checkbox" is="emby-checkbox">
                        <span>Animation audio</span>
                    </label>
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input id="Confetti" type="checkbox" is="emby-checkbox">
                        <span>Confetti</span>
                    </label>
                </div>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="AnimationDurationMs">Animation duration (ms)</label>
                    <input id="AnimationDurationMs" type="number" is="emby-input" min="500" max="10000">
                </div>

                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="HistorySize">History size</label>
                    <input id="HistorySize" type="number" is="emby-input" min="0" max="20">
                </div>

                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Save</span>
                    </button>
                    <p style="margin-top:1rem"><a href="/Randomizer/Page" target="_blank" rel="noopener">Open Randomizer</a></p>
                </div>
            </form>
        </div>
    </div>

    <script type="text/javascript">
        var RandomizerConfig = {
            pluginUniqueId: '4e1a3b62-3d7f-4d8f-a0a9-2f2f3c9d7c41'
        };

        document.querySelector('#randomizerConfigurationPage')
            .addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(RandomizerConfig.pluginUniqueId).then(function (config) {
                    document.querySelector('#Enabled').checked = !!config.Enabled;
                    document.querySelector('#DefaultEpisodeStrategy').value = config.DefaultEpisodeStrategy || 'EqualEpisode';
                    document.querySelector('#DefaultWatchedFilter').value = config.DefaultWatchedFilter || 'All';
                    document.querySelector('#AnimationEnabled').checked = !!config.AnimationEnabled;
                    document.querySelector('#AnimationAudio').checked = !!config.AnimationAudio;
                    document.querySelector('#Confetti').checked = !!config.Confetti;
                    document.querySelector('#AnimationDurationMs').value = config.AnimationDurationMs ?? 2200;
                    document.querySelector('#HistorySize').value = config.HistorySize ?? 0;
                    Dashboard.hideLoadingMsg();
                }).catch(function (err) {
                    Dashboard.hideLoadingMsg();
                    Dashboard.alert('Unable to load Randomizer settings.');
                    console.error(err);
                });
            });

        document.querySelector('#randomizerConfigurationForm')
            .addEventListener('submit', function (e) {
                Dashboard.showLoadingMsg();

                ApiClient.getPluginConfiguration(RandomizerConfig.pluginUniqueId).then(function (config) {
                    config.Enabled = document.querySelector('#Enabled').checked;
                    config.DefaultEpisodeStrategy = document.querySelector('#DefaultEpisodeStrategy').value;
                    config.DefaultWatchedFilter = document.querySelector('#DefaultWatchedFilter').value;
                    config.AnimationEnabled = document.querySelector('#AnimationEnabled').checked;
                    config.AnimationAudio = document.querySelector('#AnimationAudio').checked;
                    config.Confetti = document.querySelector('#Confetti').checked;
                    config.AnimationDurationMs = parseInt(document.querySelector('#AnimationDurationMs').value, 10) || 2200;
                    config.HistorySize = parseInt(document.querySelector('#HistorySize').value, 10) || 0;

                    return ApiClient.updatePluginConfiguration(RandomizerConfig.pluginUniqueId, config);
                }).then(function (result) {
                    Dashboard.processPluginConfigurationUpdateResult(result);
                    Dashboard.hideLoadingMsg();
                }).catch(function (err) {
                    Dashboard.hideLoadingMsg();
                    Dashboard.alert('Unable to save Randomizer settings.');
                    console.error(err);
                });

                e.preventDefault();
                return false;
            });
    </script>
</div>
</body>
</html>
