<div id="jfr-config"><h2>Jellyfin Randomizer</h2><label><input id="Enabled" type="checkbox"> Enable Randomizer</label><br><label>Default episode strategy <select id="DefaultEpisodeStrategy"><option>EqualEpisode</option><option>EqualShow</option></select></label><br><label>Default watched filter <select id="DefaultWatchedFilter"><option>All</option><option>Unwatched</option><option>Watched</option></select></label><br><label><input id="AnimationEnabled" type="checkbox"> Roulette presentation</label><br><label><input id="AnimationAudio" type="checkbox"> Animation audio</label><br><label><input id="Confetti" type="checkbox"> Confetti</label><br><label>Animation duration <input id="AnimationDurationMs" type="number" min="500" max="10000"></label><br><label>History size <input id="HistorySize" type="number" min="0" max="20"></label><br><button id="save">Save</button></div><script>(async()=>{const id=ApiClient.getPluginUniqueId('Jellyfin Randomizer'),c=await ApiClient.getPluginConfiguration(id);['Enabled','DefaultEpisodeStrategy','DefaultWatchedFilter','AnimationEnabled','AnimationAudio','Confetti','AnimationDurationMs','HistorySize'].forEach(k=>{const e=document.getElementById(k);if(e.type==='checkbox')e.checked=c[k];else e.value=c[k];});document.getElementById('save').onclick=async()=>{const n=await ApiClient.getPluginConfiguration(id);['Enabled','DefaultEpisodeStrategy','DefaultWatchedFilter','AnimationEnabled','AnimationAudio','Confetti','AnimationDurationMs','HistorySize'].forEach(k=>{const e=document.getElementById(k);n[k]=e.type==='checkbox'?e.checked:e.type==='number'?Number(e.value):e.value;});await ApiClient.updatePluginConfiguration(id,n);Dashboard.alert('Saved');};})();</script>
