name: CI
on: [push,pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: dotnet restore Jellyfin-Randomizer.sln
      - run: dotnet build Jellyfin-Randomizer.sln --configuration Release --no-restore
      - run: dotnet test Jellyfin-Randomizer.sln --configuration Release --no-build