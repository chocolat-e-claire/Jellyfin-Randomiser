name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore plugin
        run: dotnet restore Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj
      - name: Restore tests
        run: dotnet restore Tests/Jellyfin.Plugin.Randomizer.Tests.csproj
      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test Tests/Jellyfin.Plugin.Randomizer.Tests.csproj --configuration Release --no-restore
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("Jellyfin.Plugin.Randomizer/meta.json"))["version"])')
          rm -rf package "Jellyfin.Plugin.Randomizer_${VERSION}.zip"
          mkdir -p package
          dotnet publish Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj --configuration Release --no-restore --output package
          cp Jellyfin.Plugin.Randomizer/meta.json package/meta.json
          find package -type f -exec touch -d '1980-01-01 00:00:00 UTC' {} +
          (cd package && zip -X -r "../Jellyfin.Plugin.Randomizer_${VERSION}.zip" .)
          echo "== Verify exact package contents =="
          expected_entries=
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.Randomizer-package
          path: Jellyfin.Plugin.Randomizer_*.zip
Jellyfin.Plugin.Randomizer.deps.json\nJellyfin.Plugin.Randomizer.dll\nJellyfin.Plugin.Randomizer.pdb\nmeta.json'
          actual_entries="$(unzip -Z1 "Jellyfin.Plugin.Randomizer_\${VERSION}.zip" | sort)"
          printf '%s\n' "$actual_entries"
          test "$actual_entries" = "$(printf '%s\n' "$expected_entries" | sort)"
          ! unzip -Z1 "Jellyfin.Plugin.Randomizer_\${VERSION}.zip" | grep -Fxq 'Newtonsoft.Json.dll'
          test "$(unzip -Z1 "Jellyfin.Plugin.Randomizer_\${VERSION}.zip" | grep -c '/')" -eq 0

          size="$(stat -c '%s' "Jellyfin.Plugin.Randomizer_\${VERSION}.zip")"
          md5="$(md5sum "Jellyfin.Plugin.Randomizer_\${VERSION}.zip" | cut -d ' ' -f1)"
          sha256="$(sha256sum "Jellyfin.Plugin.Randomizer_\${VERSION}.zip" | cut -d ' ' -f1)"
          echo "package-size=$size"
          echo "package-md5=$md5"
          echo "package-sha256=$sha256"

          if [ "$VERSION" = "0.1.0.7" ]; then
            test "$size" = "35169"
            test "$md5" = "df22129cce963c359bdcf008015bc1d7"
            test "$sha256" = "fcc0845d00e6661e2aed6056c5d2dc47b59fbc0bd6a290d84bedd3363de7e9b0"
          fi

          md5sum "Jellyfin.Plugin.Randomizer_${VERSION}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.Randomizer-package
          path: Jellyfin.Plugin.Randomizer_*.zip
