name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore plugin
        run: dotnet restore Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj
      - name: Restore tests
        run: dotnet restore Tests/Jellyfin.Plugin.Randomizer.Tests.csproj
      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test Tests/Jellyfin.Plugin.Randomizer.Tests.csproj --configuration Release --no-restore
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package Jellyfin.Plugin.Randomizer_0.1.0.4.zip
          mkdir -p package
          dotnet publish Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj --configuration Release --no-restore --output package
          cp Jellyfin.Plugin.Randomizer/meta.json package/meta.json
          find package -type f -exec touch -d '1980-01-01 00:00:00 UTC' {} +
          (cd package && zip -X -r ../Jellyfin.Plugin.Randomizer_0.1.0.4.zip .)
          md5sum Jellyfin.Plugin.Randomizer_0.1.0.4.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.Randomizer_0.1.0.4
          path: Jellyfin.Plugin.Randomizer_0.1.0.4.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Jellyfin.Plugin.Randomizer_0.1.0.4
          path: .
      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          test -f Jellyfin.Plugin.Randomizer_0.1.0.4.zip
          md5sum Jellyfin.Plugin.Randomizer_0.1.0.4.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v0.1.0.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.1.0.4 Jellyfin.Plugin.Randomizer_0.1.0.4.zip               --repo "$GITHUB_REPOSITORY"               --title "Jellyfin Randomizer v0.1.0.4"               --notes "Safe server-only build; removed HTTP response interception."
          fi
