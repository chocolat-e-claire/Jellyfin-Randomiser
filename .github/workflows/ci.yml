name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore plugin
        run: dotnet restore Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj
      - name: Restore tests
        run: dotnet restore Tests/Jellyfin.Plugin.Randomizer.Tests.csproj
      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test Tests/Jellyfin.Plugin.Randomizer.Tests.csproj --configuration Release --no-restore
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("Jellyfin.Plugin.Randomizer/meta.json"))["version"])')
          rm -rf package "Jellyfin.Plugin.Randomizer_${VERSION}.zip"
          mkdir -p package
          dotnet publish Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj --configuration Release --no-restore --output package
          cp Jellyfin.Plugin.Randomizer/meta.json package/meta.json
          find package -type f -exec touch -d '1980-01-01 00:00:00 UTC' {} +
          (cd package && zip -X -r "../Jellyfin.Plugin.Randomizer_${VERSION}.zip" .)
          md5sum "Jellyfin.Plugin.Randomizer_${VERSION}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.Randomizer-package
          path: Jellyfin.Plugin.Randomizer_*.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        run: echo "version=$(python3 -c 'import json; print(json.load(open("Jellyfin.Plugin.Randomizer/meta.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Jellyfin.Plugin.Randomizer-package
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          asset="release/Jellyfin.Plugin.Randomizer_${VERSION}.zip"
          test -f "$asset"
          if ! gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v${VERSION}" "$asset"               --repo "$GITHUB_REPOSITORY"               --title "Jellyfin Randomizer v${VERSION}"               --notes "Verified release with Jellyfin standard plugin configuration API."
          fi

          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v${VERSION}/Jellyfin.Plugin.Randomizer_${VERSION}.zip"
          rm -f /tmp/published.zip
          for attempt in {1..10}; do
            if curl -fsSL "$url" -o /tmp/published.zip; then
              break
            fi
            sleep 2
          done
          test -s /tmp/published.zip

          local_md5=$(md5sum "$asset" | cut -d' ' -f1)
          remote_md5=$(md5sum /tmp/published.zip | cut -d' ' -f1)
          local_sha=$(sha256sum "$asset" | cut -d' ' -f1)
          remote_sha=$(sha256sum /tmp/published.zip | cut -d' ' -f1)

          echo "Local MD5:  $local_md5"
          echo "Remote MD5: $remote_md5"
          echo "Local SHA256:  $local_sha"
          echo "Remote SHA256: $remote_sha"

          test "$local_md5" = "$remote_md5"
          test "$local_sha" = "$remote_sha"
          test "$(stat -c '%s' "$asset")" = "$(stat -c '%s' /tmp/published.zip)"
