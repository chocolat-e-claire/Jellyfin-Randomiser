name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore plugin
        run: dotnet restore Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj
      - name: Restore tests
        run: dotnet restore Tests/Jellyfin.Plugin.Randomizer.Tests.csproj
      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test Tests/Jellyfin.Plugin.Randomizer.Tests.csproj --configuration Release --no-restore
      - name: Verify catalog icon metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s images/randomizer.svg
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          plugin = manifest[0]
          assert plugin["imageUrl"].endswith("/images/randomizer.svg")
          assert any(v["version"] == "0.1.0.12" for v in plugin["versions"])
          print("Catalog icon:", plugin["imageUrl"])
          PY

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("Jellyfin.Plugin.Randomizer/meta.json"))["version"])')
          rm -rf package "Jellyfin.Plugin.Randomizer_${VERSION}.zip"
          mkdir -p package
          dotnet publish Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj --configuration Release --no-restore --output package
          cp Jellyfin.Plugin.Randomizer/meta.json package/meta.json
          find package -type f -exec touch -d '1980-01-01 00:00:00 UTC' {} +
          (cd package && zip -X -r "../Jellyfin.Plugin.Randomizer_${VERSION}.zip" .)

          echo "== Verify exact package contents =="
          expected_entries=$'Jellyfin.Plugin.Randomizer.deps.json\nJellyfin.Plugin.Randomizer.dll\nJellyfin.Plugin.Randomizer.pdb\nmeta.json'
          actual_entries="$(unzip -Z1 "Jellyfin.Plugin.Randomizer_${VERSION}.zip" | sort)"
          printf '%s\n' "$actual_entries"
          test "$actual_entries" = "$(printf '%s\n' "$expected_entries" | sort)"
          ! unzip -Z1 "Jellyfin.Plugin.Randomizer_${VERSION}.zip" | grep -Fxq 'Newtonsoft.Json.dll'
          test "$(unzip -Z1 "Jellyfin.Plugin.Randomizer_${VERSION}.zip" | grep -c '/')" -eq 0

          size="$(stat -c '%s' "Jellyfin.Plugin.Randomizer_${VERSION}.zip")"
          md5="$(md5sum "Jellyfin.Plugin.Randomizer_${VERSION}.zip" | cut -d ' ' -f1)"
          sha256="$(sha256sum "Jellyfin.Plugin.Randomizer_${VERSION}.zip" | cut -d ' ' -f1)"
          echo "package-size=$size"
          echo "package-md5=$md5"
          echo "package-sha256=$sha256"

          test "$VERSION" = "0.1.0.12"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.Randomizer-package
          path: Jellyfin.Plugin.Randomizer_*.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("Jellyfin.Plugin.Randomizer/meta.json"))["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: Jellyfin.Plugin.Randomizer-package
          path: release-package

      - name: Verify package and record checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          package="release-package/Jellyfin.Plugin.Randomizer_${version}.zip"
          test -f "$package"
          entries=()
          while IFS= read -r entry; do
            entries+=("$entry")
          done < <(unzip -Z1 "$package" | sort)
          test "${#entries[@]}" -eq 4
          test "${entries[0]}" = "Jellyfin.Plugin.Randomizer.deps.json"
          test "${entries[1]}" = "Jellyfin.Plugin.Randomizer.dll"
          test "${entries[2]}" = "Jellyfin.Plugin.Randomizer.pdb"
          test "${entries[3]}" = "meta.json"
          ! unzip -Z1 "$package" | grep -Fxq 'Newtonsoft.Json.dll'
          test "$(unzip -Z1 "$package" | grep -c '/')" -eq 0
          md5="$(md5sum "$package" | cut -d ' ' -f1)"
          sha256="$(sha256sum "$package" | cut -d ' ' -f1)"
          size="$(stat -c '%s' "$package")"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "md5=$md5" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "Release package: $package"
          echo "MD5: $md5"
          echo "SHA256: $sha256"
          echo "Size: $size"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "Release v${version} already exists; nothing to do."
            exit 0
          fi
          gh release create "v${version}" \
            "${{ steps.package.outputs.package }}" \
            --title "Jellyfin Randomizer v${version}" \
            --notes "Validated Jellyfin Server 10.10.7 release. Includes safe File Transformation Web integration and Jellyfin-Roulette-style Details navigation."

      - name: Record published release checksum in manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          asset="Jellyfin.Plugin.Randomizer_${version}.zip"
          rm -rf published-release
          mkdir -p published-release
          gh release download "v${version}" --pattern "${asset}" --dir published-release --clobber
          published="${PWD}/published-release/${asset}"
          test -f "${published}"
          published_md5="$(md5sum "${published}" | cut -d ' ' -f1)"
          published_sha256="$(sha256sum "${published}" | cut -d ' ' -f1)"
          published_size="$(stat -c '%s' "${published}")"
          echo "Published release asset: ${published}"
          echo "Published release MD5: ${published_md5}"
          echo "Published release SHA256: ${published_sha256}"
          echo "Published release size: ${published_size}"

          python3 - "${version}" "${published_md5}" <<'PY'
          import json
          import sys
          path = "manifest.json"
          version = sys.argv[1]
          checksum = sys.argv[2]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          entry = next(v for v in data[0]["versions"] if v["version"] == version)
          entry["checksum"] = checksum
          entry["sourceUrl"] = f"https://github.com/chocolat-e-claire/Jellyfin-Randomiser/releases/download/v{version}/Jellyfin.Plugin.Randomizer_{version}.zip"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

          if git diff --quiet -- manifest.json; then
            echo "Manifest already contains the published release checksum."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Record published release checksum for v${version}"
          git push
