name: Jellyfin 10.10.7 integration acceptance

on:
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore plugin
        run: dotnet restore Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj

      - name: Build plugin
        run: dotnet publish Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj --configuration Release --no-restore --output package

      - name: Read candidate version
        shell: bash
        run: |
          set -euo pipefail
          META_VERSION="$(python3 -c 'import json; print(json.load(open("Jellyfin.Plugin.Randomizer/meta.json"))["version"])')"
          PROJECT_VERSION="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj)"
          PACKAGE_VERSION="$(python3 -c 'import json; print(json.load(open("package/Jellyfin.Plugin.Randomizer.deps.json"))["runtimeTarget"]["name"].split(",")[0].split("/")[1])' 2>/dev/null || true)"
          test "$META_VERSION" = "$PROJECT_VERSION"
          VERSION="$META_VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate synthetic media fixtures
        run: bash scripts/create-fixtures-10.10.7.sh smoke-media

      - name: Install candidate and File Transformation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf smoke-config
          mkdir -p "smoke-config/plugins/Jellyfin Randomizer_${VERSION}"
          cp -a package/. "smoke-config/plugins/Jellyfin Randomizer_${VERSION}/"

          curl -fsSL -o file-transformation.zip \
            https://github.com/IAmParadox27/jellyfin-plugin-file-transformation/releases/download/2.5.9.0/Release-10.10.7.zip
          mkdir -p "smoke-config/plugins/File Transformation_2.5.9.0"
          unzip -q file-transformation.zip -d "smoke-config/plugins/File Transformation_2.5.9.0"

          chmod -R a+rwx smoke-config

      - name: Capture pristine Jellyfin file hashes
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh jellyfin/jellyfin:10.10.7 \
            -c 'find /jellyfin -type f -print0 | sort -z | xargs -0 sha256sum' \
            > pristine-jellyfin.sha256


      - name: Start isolated Jellyfin 10.10.7
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name jellyfin-randomizer-acceptance \
            -p 8096:8096 \
            -v "$PWD/smoke-config:/config" \
            -v "$PWD/smoke-media:/media:ro" \
            jellyfin/jellyfin:10.10.7

      - name: Verify File Transformation injection
        shell: bash
        run: |
          set -euo pipefail

          healthy=false
          injected=false

          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8096/health >/dev/null 2>&1; then
              healthy=true
            fi

            if curl -fsS http://127.0.0.1:8096/web/index.html 2>/dev/null \
              | grep -Fq 'data-jellyfin-randomizer-loader'; then
              injected=true
            fi

            if [ "$healthy" = true ] && [ "$injected" = true ]; then
              break
            fi

            if ! docker ps --filter name=jellyfin-randomizer-acceptance --filter status=running -q | grep -q .; then
              docker logs jellyfin-randomizer-acceptance || true
              exit 1
            fi

            sleep 2
          done

          echo "healthy=$healthy injected=$injected"
          [ "$healthy" = true ]
          loader_count="$(curl -fsS http://127.0.0.1:8096/web/index.html | grep -o 'data-jellyfin-randomizer-loader' | wc -l)"
          test "$loader_count" -eq 2
          echo "Randomizer loader tag count: $loader_count"

          [ "$injected" = true ]

          docker exec jellyfin-randomizer-acceptance \
            sh -c 'find /jellyfin -type f -print0 | sort -z | xargs -0 sha256sum' \
            > jellyfin-with-randomizer.sha256
          diff -u pristine-jellyfin.sha256 jellyfin-with-randomizer.sha256

          docker logs jellyfin-randomizer-acceptance 2>&1 | tee integration-startup.log
          grep -F 'Loaded plugin: File Transformation 2.5.9.0' integration-startup.log
          grep -F 'Jellyfin Randomizer' integration-startup.log
          grep -F 'Randomizer startup service executing.' integration-startup.log
          grep -F 'Registered Jellyfin Randomizer Web transformation for index.html.' integration-startup.log
          ! grep -Eiq 'Unhandled exception|fail:.*Jellyfin.Plugin.Randomizer|Application startup exception|host terminated unexpectedly' integration-startup.log

      - name: Verify HTTP assets and run API acceptance suite
        shell: bash
        env:
          JELLYFIN_URL: http://127.0.0.1:8096
        run: |
          set -euo pipefail
          curl -fsS "$JELLYFIN_URL/Randomizer/Script.js" | grep -Fq 'JellyfinRandomizer'
          curl -fsS "$JELLYFIN_URL/Randomizer/Styles.css" | grep -Fq 'jfr-backdrop'
          bash scripts/acceptance-10.10.7.sh

      - name: Run real Jellyfin Web browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-playwright
          mkdir -p .ci-playwright
          docker run --rm \
            --network host \
            -v "$PWD/scripts:/tests:ro" \
            -v "$PWD/.ci-playwright:/playwright" \
            -e JELLYFIN_URL=http://127.0.0.1:8096 \
            -e JELLYFIN_USER=ci-randomizer \
            -e JELLYFIN_PASSWORD=ci-randomizer-password \
            -e PLAYWRIGHT_MODULE=/playwright/node_modules/playwright \
            mcr.microsoft.com/playwright:v1.49.1-noble \
            bash -lc 'cd /playwright && npm init -y >/dev/null 2>&1 && npm install --no-audit --no-fund --save-exact playwright@1.49.1 >/dev/null 2>&1 && node /tests/browser-10.10.7.mjs'

      - name: Test clean uninstall and server restart
        shell: bash
        run: |
          set -euo pipefail

          docker rm -f jellyfin-randomizer-acceptance
          rm -rf "smoke-config/plugins/Jellyfin Randomizer_${VERSION}"

          docker run -d \
            --name jellyfin-randomizer-acceptance \
            -p 8096:8096 \
            -v "$PWD/smoke-config:/config" \
            -v "$PWD/smoke-media:/media:ro" \
            jellyfin/jellyfin:10.10.7

          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8096/health >/dev/null 2>&1; then
              break
            fi
            if ! docker ps --filter name=jellyfin-randomizer-acceptance --filter status=running -q | grep -q .; then
              docker logs jellyfin-randomizer-acceptance || true
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8096/health >/dev/null
          docker exec jellyfin-randomizer-acceptance \
            sh -c 'find /jellyfin -type f -print0 | sort -z | xargs -0 sha256sum' \
            > jellyfin-after-uninstall.sha256
          diff -u pristine-jellyfin.sha256 jellyfin-after-uninstall.sha256


          if curl -fsS http://127.0.0.1:8096/web/index.html | grep -Fq 'data-jellyfin-randomizer-loader'; then
            echo "Randomizer Web loader remained after plugin removal."
            exit 1
          fi

          docker logs jellyfin-randomizer-acceptance 2>&1 | tee uninstall.log
          ! grep -Eiq 'Unhandled exception|fail:.*Jellyfin.Plugin.Randomizer|Application startup exception|host terminated unexpectedly' uninstall.log

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-10.10.7-integration-diagnostics
          if-no-files-found: ignore
          path: |
            integration-startup.log
            uninstall.log
            pristine-jellyfin.sha256
            jellyfin-with-randomizer.sha256
            jellyfin-after-uninstall.sha256

      - name: Cleanup
        if: always()
        run: docker rm -f jellyfin-randomizer-acceptance || true

  no-file-transformation:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build plugin
        run: |
          set -euo pipefail
          dotnet restore Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj
          dotnet publish Jellyfin.Plugin.Randomizer/Jellyfin.Plugin.Randomizer.csproj --configuration Release --no-restore --output package

      - name: Install candidate without File Transformation
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("Jellyfin.Plugin.Randomizer/meta.json"))["version"])')"
          rm -rf smoke-config
          mkdir -p "smoke-config/plugins/Jellyfin Randomizer_${VERSION}"
          cp -a package/. "smoke-config/plugins/Jellyfin Randomizer_${VERSION}/"
          chmod -R a+rwx smoke-config

      - name: Start isolated Jellyfin 10.10.7 without File Transformation
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name jellyfin-randomizer-no-ft \
            -p 8097:8096 \
            -v "$PWD/smoke-config:/config" \
            jellyfin/jellyfin:10.10.7

      - name: Verify optional dependency failure is non-fatal
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8097/health >/dev/null 2>&1; then
              break
            fi
            if ! docker ps --filter name=jellyfin-randomizer-no-ft --filter status=running -q | grep -q .; then
              docker logs jellyfin-randomizer-no-ft || true
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8097/health >/dev/null
          docker logs jellyfin-randomizer-no-ft 2>&1 | tee no-ft.log
          grep -F 'Randomizer could not find the File Transformation assembly.' no-ft.log
          ! grep -Eiq 'Unhandled exception|fail:.*Jellyfin.Plugin.Randomizer|Application startup exception|host terminated unexpectedly' no-ft.log

      - name: Upload no-File-Transformation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-10.10.7-no-file-transformation-diagnostics
          if-no-files-found: ignore
          path: |
            no-ft.log

      - name: Cleanup
        if: always()
        run: docker rm -f jellyfin-randomizer-no-ft || true
